[package]
name = "talescribe"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
nom = "8"
rand = "0.10.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
talescribe_protocol = { version = "0.1.0", path = "../protocol" }
toml = "1"

[dev-dependencies]
tempfile = "3"
